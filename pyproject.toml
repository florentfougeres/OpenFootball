[project]
name = "openfootball"
version = "0.1.0"
description = "Effectifs de clubs de football par saison, à partir de Wikipedia et Wikidata."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
openfootball = "openfootball.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openfootball*"]

[tool.setuptools.package-data]
"openfootball.migrations" = ["*.sql"]
"openfootball.scopes" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
