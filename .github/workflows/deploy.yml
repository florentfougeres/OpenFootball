name: Deploy site

# D9 : le site est publié avec les données de la DERNIÈRE release GitHub.
# Un navigateur ne peut pas lire un asset de release directement (pas de CORS) : on le télécharge
# ici, côté serveur, et on le sert depuis le même domaine que la page.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download data from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          # Déclenché par une release : on prend CETTE release (« la dernière » peut ne pas encore être celle qui vient d'être publiée).
          # Lancé à la main ou par un push : la dernière release.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download ${RELEASE_TAG:+"$RELEASE_TAG"} --repo "$GITHUB_REPOSITORY" --pattern "*-data.tar.gz" --dir "$RUNNER_TEMP"
          archive=$(ls "$RUNNER_TEMP"/*-data.tar.gz)
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then echo "archive suspecte (chemin absolu ou « .. »)"; exit 1; fi
          mkdir -p web/public/data
          tar -xzf "$archive" --no-same-owner -C web/public/data
          test -s web/public/data/manifest.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
