name: Deploy site

# D9 : le site est publié avec les données de la DERNIÈRE release GitHub.
# Un navigateur ne peut pas lire un asset de release directement (pas de CORS) : on le télécharge
# ici, côté serveur, et on le sert depuis le même domaine que la page.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download data from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "openfootball-data.tar.gz" --dir "$RUNNER_TEMP"
          mkdir -p web/public/data
          tar -xzf "$RUNNER_TEMP/openfootball-data.tar.gz" -C web/public/data
          test -s web/public/data/manifest.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
